[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docground"
version = "0.1.0"
description = "Documentation-grounded prompt revision and verification for LLM code generation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.34",
    "bandit>=1.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real API calls (skipped unless explicitly enabled)",
]

[tool.setuptools.packages.find]
include = ["docground*"]
