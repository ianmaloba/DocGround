[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docground"
version = "0.1.0"
description = "Documentation-grounded prompt revision and verification for LLM code generation"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real API calls (skipped unless explicitly enabled)",
    "docker: integration tests using a local Docker image (opt in with DOCGROUND_RUN_DOCKER_TESTS=1)",
]

[tool.setuptools.packages.find]
include = ["docground*"]
namespaces = false

[tool.setuptools.package-data]
"docground.data" = ["*.json"]
