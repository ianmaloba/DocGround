[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "docground"
dynamic = ["version"]
description = "Documentation-grounded prompt revision and verification for LLM code generation"
readme = "README.md"
authors = [{name = "ianmaloba", email = "ianmalobamwakha@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
docground = "docground.cli:main"

[project.urls]
Repository = "https://github.com/ianmaloba/DocGround"
Issues = "https://github.com/ianmaloba/DocGround/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real API calls (skipped unless explicitly enabled)",
    "docker: integration tests using a local Docker image (opt in with DOCGROUND_RUN_DOCKER_TESTS=1)",
]

[tool.setuptools.packages.find]
include = ["docground*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "docground.__version__"}

[tool.setuptools.package-data]
"docground.data" = ["*.json"]
